<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Topup Shop</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        body { background: #0f172a; color: #fff; padding: 20px 10px; }
        .container { max-width: 500px; margin: auto; background: #1e293b; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #f97316; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; }
        
        .pack-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .pack-item { background: #334155; padding: 15px; text-align: center; border-radius: 6px; cursor: pointer; border: 2px solid transparent; }
        .pack-item.active { border-color: #f97316; background: #475569; }
        .pack-item p { margin-top: 5px; color: #38bdf8; font-weight: bold; }
        
        .payment-info { background: #0f172a; padding: 12px; border-radius: 6px; margin-top: 15px; font-size: 14px; border-left: 4px solid #f97316; }
        button { width: 100%; background: #f97316; color: #fff; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 20px; }
        button:hover { background: #ea580c; }
        button:disabled { background: #64748b; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h2>Free Fire Diamond Top-up</h2>
    
    <label>১. Player ID (UID) দিন:</label>
    <input type="number" id="playerId" placeholder="যেমন: 123456789" required>

    <label>২. ডায়মন্ড প্যাক সিলেক্ট করুন:</label>
    <div class="pack-grid">
        <div class="pack-item active" onclick="selectPack(this, '115 Diamonds', 80)">
            <b>115 Diamonds</b>
            <p>৳ 80</p>
        </div>
        <div class="pack-item" onclick="selectPack(this, '240 Diamonds', 160)">
            <b>240 Diamonds</b>
            <p>৳ 160</p>
        </div>
        <div class="pack-item" onclick="selectPack(this, '610 Diamonds', 400)">
            <b>610 Diamonds</b>
            <p>৳ 400</p>
        </div>
        <div class="pack-item" onclick="selectPack(this, 'Weekly Membership', 170)">
            <b>Weekly</b>
            <p>৳ 170</p>
        </div>
    </div>

    <label>৩. পেমেন্ট মেথড:</label>
    <select id="paymentMethod">
        <option value="bKash">বিকাশ (Personal Send Money)</option>
        <option value="Nagad">নগদ (Personal Send Money)</option>
    </select>

    <div class="payment-info">
        টাকা পাঠানোর নম্বর: <b>017XXXXXXXX</b><br>
        (Send Money করে TrxID নিচে বসান)
    </div>

    <label>৪. Transaction ID (TrxID):</label>
    <input type="text" id="trxId" placeholder="যেমন: 9J5K2L..." required>

    <button onclick="submitOrder()">অর্ডার কনফার্ম করুন</button>
</div>

<script>
    let selectedPackage = "115 Diamonds";
    let selectedPrice = 80;

    function selectPack(element, packName, price) {
        document.querySelectorAll('.pack-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        selectedPackage = packName;
        selectedPrice = price;
    }

    function submitOrder() {
        const uid = document.getElementById('playerId').value.trim();
        const trxId = document.getElementById('trxId').value.trim();
        const method = document.getElementById('paymentMethod').value;
        const submitBtn = document.querySelector('button');

        if (!uid || !trxId) {
            alert("অনুগ্রহ করে UID এবং TrxID সঠিকভাবে দিন!");
            return;
        }

        submitBtn.innerText = "অর্ডার প্রসেস হচ্ছে...";
        submitBtn.disabled = true;

        const botToken = "8835477513:AAHdsbskTwgNs16ord36FAhe7JYhWeWQBXY";
        const chatId = "8778499897";

        const text = `🛒 *নতুন অর্ডার এসেছে!*\n\n` +
                     `👤 *Player UID:* \`${uid}\`\n` +
                     `💎 *প্যাকেজ:* ${selectedPackage}\n` +
                     `💵 *মূল্য:* ৳${selectedPrice}\n` +
                     `💳 *মেথড:* ${method}\n` +
                     `🧾 *TrxID:* \`${trxId}\``;

        const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

        fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                chat_id: chatId,
                text: text,
                parse_mode: "Markdown"
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.ok) {
                alert("আপনার অর্ডারটি সফলভাবে গ্রহণ করা হয়েছে!");
                document.getElementById('playerId').value = '';
                document.getElementById('trxId').value = '';
            } else {
                alert("অর্ডার পাঠাতে সমস্যা হয়েছে। আপনার টেলিগ্রাম বটে গিয়ে /start চাপ দিয়েছেন কিনা চেক করুন।");
            }
        })
        .catch(error => {
            console.error("Error:", error);
            alert("নেটওয়ার্ক সমস্যা হয়েছে!");
        })
        .finally(() => {
            submitBtn.innerText = "অর্ডার কনফার্ম করুন";
            submitBtn.disabled = false;
        });
    }
</script>

</body>
</html>
